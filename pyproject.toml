[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-lattice-governor"
dynamic = ["version"]
description = "Plan exacto del orden de aterrizaje de ramas git bajo solvencia por prefijo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platino Labs" }]
keywords = ["git", "merge-queue", "monorepo", "ast", "continuous-integration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
merge-lattice-governor = "merge_lattice_governor.cli:main"

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/merge-lattice-governor"

[tool.setuptools.dynamic]
version = { attr = "merge_lattice_governor.__version__" }

[tool.setuptools.packages.find]
include = ["merge_lattice_governor*"]

# Frontera arquitectónica del sujeto, leída por `platino-scan` (>= 1.4.0) desde
# el propio árbol: un clon frío certifica la arquitectura sin banderas de CLI.
#
# `tests/` no se excluye, se particiona: la regla de barrel deja de aplicarse a
# la suite (que concentra el 55.6 % del grafo porque una suite densa importa a
# propósito) y el detector de ciclos sigue midiendo dentro de `tests/` y a través
# de la frontera. El universo medido se publica en cada corrida.
#
# Límite del mecanismo, medido: `puertas` aporta trazabilidad, no autoridad. Un
# módulo interno con 90.0 % de conectividad sale RC 1 como barrel y RC 0 si se
# declara aquí, sin que el escáner pueda distinguir los dos casos. Por eso cada
# puerta de abajo cita la cláusula que la hace puerta, y esa cita es lo que
# revisa una persona en el diff.
[tool.platino-scan]
pruebas = ["tests"]
# Las tres puertas lo son por contrato, no por conveniencia: `cli.py` es el
# target del console_script de arriba, `__main__.py` el de `python -m`, y
# `__init__.py` la superficie de importación pública. Que las dos primeras
# concentren el 100 % y el 88.9 % del subgrafo de producto es su definición.
puertas = [
  "merge_lattice_governor/cli.py",
  "merge_lattice_governor/__main__.py",
  "merge_lattice_governor/__init__.py",
]
