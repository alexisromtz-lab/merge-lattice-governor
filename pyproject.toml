[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "merge-lattice-governor"
dynamic = ["version"]
description = "Plan exacto del orden de aterrizaje de ramas git bajo solvencia por prefijo"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Platino Labs" }]
keywords = ["git", "merge-queue", "monorepo", "ast", "continuous-integration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
merge-lattice-governor = "merge_lattice_governor.cli:main"

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/merge-lattice-governor"

[tool.setuptools.dynamic]
version = { attr = "merge_lattice_governor.__version__" }

[tool.setuptools.packages.find]
include = ["merge_lattice_governor*"]
