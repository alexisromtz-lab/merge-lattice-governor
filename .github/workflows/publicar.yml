name: publicar

# Publica en PyPI por OIDC: cero tokens estáticos en el repositorio.
#
# Requisito de una sola vez y fuera del código: registrar en pypi.org un
# «pending publisher» para alexisromtz-lab/merge-lattice-governor con
# workflow `publicar.yml` y entorno `pypi`. Hasta que ese registro exista,
# este flujo falla en el paso de subida y **no publica nada**; la guarda de
# etiqueta corre antes de construir, así que un tag equivocado tampoco llega.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La etiqueta y el manifiesto son el mismo objeto
        run: python scripts/verificar_etiqueta.py "${GITHUB_REF_NAME}"
      - name: Construir
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
