name: publicar

# Un tag publica en dos destinos, y el segundo no depende de credenciales:
#
# 1. El wheel se adjunta al release de GitHub. Es la puerta de instalación que
#    funciona hoy —`pip install <url del .whl>`— sin cuenta ni token.
# 2. PyPI por OIDC, sin tokens estáticos, **sólo** si el repositorio declara la
#    variable `PUBLICAR_PYPI=si`. Antes de eso hay un registro que no vive en el
#    código: el «pending publisher» de pypi.org para alexisromtz-lab/
#    merge-lattice-governor, workflow `publicar.yml`, entorno `pypi`. Encender
#    la variable sin ese registro deja el paso en rojo, y por eso está apagada.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: La etiqueta y el manifiesto son el mismo objeto
        run: python scripts/verificar_etiqueta.py "${GITHUB_REF_NAME}"
      - name: Construir
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Adjuntar el wheel al release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/*.whl --clobber
      - name: Publicar en PyPI
        if: vars.PUBLICAR_PYPI == 'si'
        uses: pypa/gh-action-pypi-publish@release/v1
